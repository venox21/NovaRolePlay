<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA G-Interaktionsmenü</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="overlay" id="g-overlay">
    <div class="g-modal" id="g-modal">
      
      <!-- HEADER -->
      <div class="g-header">
        <div class="g-header-left">
          <div class="g-badge" id="g-badge">FAHRZEUG</div>
          <h2 class="g-title" id="g-title">Fahrzeug Interaktion</h2>
          <p class="g-subtitle" id="g-subtitle">Wähle eine Aktion aus</p>
        </div>
        <button class="g-btn-close" id="g-btn-close" title="Schließen (ESC / G)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <!-- ACTIONS GRID -->
      <div class="g-grid" id="g-grid">
        <!-- Dynamisch befüllt -->
      </div>

      <!-- FOOTER HINT -->
      <div class="g-footer">
        <div class="key-hint">
          <span class="key-chip">G</span>
          <span class="key-chip">ESC</span>
          <span>zum Schließen</span>
        </div>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
