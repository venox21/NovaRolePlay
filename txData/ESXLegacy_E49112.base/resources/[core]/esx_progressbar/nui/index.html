    <head>
        <script src="https://kit.fontawesome.com/a81368914c.js"></script>
        <link rel="stylesheet" href="css/style.css" />
    <style id="nova-cyber-ui">
  :root {
    --brand: #a855f7 !important;
    --brand-color: #a855f7 !important;
    --brand-bright: #06b6d4 !important;
    --brand-rgb: 168, 85, 247 !important;
    --accent: #a855f7 !important;
    --accent-rgb: 168, 85, 247 !important;
    --accent-shade: #4f46e5 !important;
    --bg: #0b0917 !important;
    --base: #0b0917 !important;
    --darkest-color: #0b0917 !important;
    --dark-color: #131026 !important;
    --panel: #131026 !important;
    --panel-soft: #1b1636 !important;
    --raised: #1e193b !important;
    --mid-color: #1e193b !important;
  }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: rgba(11, 9, 23, 0.6); }
  ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #a855f7, #06b6d4); border-radius: 99px; }
</style>
</head>
    <body>
        <div id="notifyInfo" class="notify">
            <div class="innerText">
                <i class="fas fa-info-circle icon info"></i>
                <p class="text" id="infoMessage"></p>
            </div>
            <div id="progline" class="progline"></div>
        </div>
    </body>
    <script src="js/script.js"></script>
</html>

<style>
    .notify {
        flex: auto;
        display: none;
        position: absolute;
        margin: 0 auto;
        left: 0;
        right: 0;
        bottom: 105px;
        min-width: 240px;
        width: fit-content;
        height: 50px;
        background: linear-gradient(135deg, rgba(16, 13, 32, 0.94), rgba(10, 9, 20, 0.96));
        border: 1px solid rgba(168, 85, 247, 0.4);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65), 0 0 22px rgba(168, 85, 247, 0.25);
        border-radius: 14px;
        animation: growDown 300ms ease-in-out;
        padding-right: 16px;
        overflow: hidden;
    }

    .progline {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 4px;
        width: 100%;
        border-radius: 15px;
        background: linear-gradient(90deg, #06b6d4, #a855f7, #ec4899);
        box-shadow: 0 0 12px rgba(168, 85, 247, 0.8);
    }

    .icon {
        border: 0;
    }

    .innerText {
        flex: auto;
        margin-top: 15px;
        width: 100%;
        margin-left: 12px;
    }

    p {
        flex: auto;
        word-wrap: break-word;
        margin-left: 35px;
        margin-top: 15px;
        font-weight: 700;
        letter-spacing: 0.4px;
    }

    .innerText .icon {
        float: left;
        margin-left: 5px;
        font-size: 20px;
        color: #a855f7;
    }

    @keyframes growDown {
        0% {
            transform: scaleY(0);
        }
        80% {
            transform: scaleY(1.1);
        }
        100% {
            transform: scaleY(1);
        }
    }
</style>
