<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA Roleplay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<style id="nova-cyber-ui">
  :root {
    --brand: #a855f7 !important;
    --brand-color: #a855f7 !important;
    --brand-bright: #06b6d4 !important;
    --brand-rgb: 168, 85, 247 !important;
    --accent: #a855f7 !important;
    --accent-rgb: 168, 85, 247 !important;
    --accent-shade: #4f46e5 !important;
    --bg: #0b0917 !important;
    --base: #0b0917 !important;
    --darkest-color: #0b0917 !important;
    --dark-color: #131026 !important;
    --panel: #131026 !important;
    --panel-soft: #1b1636 !important;
    --raised: #1e193b !important;
    --mid-color: #1e193b !important;
  }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: rgba(11, 9, 23, 0.6); }
  ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #a855f7, #06b6d4); border-radius: 99px; }
</style>
</head>
<body>
    <div class="container">
        <div class="background">
            <div class="gradient-overlay"></div>
            <div class="particles" id="particles"></div>
        </div>

        <div class="content">
            <div class="logo-section">
                <img src="logo.png?v=nova" alt="NOVA Roleplay" class="logo-img">
            </div>

            <div class="loading-section">
                <div class="loading-text" id="loadingText">Initializing...</div>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="progress-info">
                    <span class="progress-percentage" id="progressPercentage">0%</span>
                    <span class="progress-status" id="progressStatus">Connecting</span>
                </div>
            </div>

            <div class="tips-section">
                <div class="tip-label">DID YOU KNOW?</div>
                <div class="tip-text" id="tipText">Press F1 to open the help menu</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
