<html lang="en">
    <head>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        <script src="https://kit.fontawesome.com/a81368914c.js"></script>
        <link rel="stylesheet" href="css/style.css" />
        <script src="js/script.js"></script>
    <style id="nova-cyber-ui">
  :root {
    --brand: #a855f7 !important;
    --brand-color: #a855f7 !important;
    --brand-bright: #06b6d4 !important;
    --brand-rgb: 168, 85, 247 !important;
    --accent: #a855f7 !important;
    --accent-rgb: 168, 85, 247 !important;
    --accent-shade: #4f46e5 !important;
    --bg: #0b0917 !important;
    --base: #0b0917 !important;
    --darkest-color: #0b0917 !important;
    --dark-color: #131026 !important;
    --panel: #131026 !important;
    --panel-soft: #1b1636 !important;
    --raised: #1e193b !important;
    --mid-color: #1e193b !important;
  }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: rgba(11, 9, 23, 0.6); }
  ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #a855f7, #06b6d4); border-radius: 99px; }
</style>
</head>
    <body>
        <div id="notifyInfo" class="notify info">
            <div class="innerText">
                <span class="material-symbols-outlined icon">info</span>
                <p class="text" id="infoMessage"></p>
            </div>
        </div>
        <div id="notifySuccess" class="notify success">
            <div class="innerText">
                <span class="material-symbols-outlined icon">check_circle</span>
                <p class="text" id="successMessage"></p>
            </div>
        </div>
        <div id="notifyError" class="notify error">
            <div class="innerText">
                <span class="material-symbols-outlined icon">error</span>
                <p class="text" id="errorMessage"></p>
            </div>
        </div>
    </body>
</html>
